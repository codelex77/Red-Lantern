<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EBB Studio Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --cream: #fbf3ef;
      --ink: #241f1f;
      --berry: #a13d63;
      --berry-dark: #7e2e4c;
      --gold: #c79a4b;
      --white: #ffffff;
      --muted: #6b5f5f;
      --border: #e4d8d4;
      --danger: #a83232;
      --success: #26734d;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Manrope", sans-serif;
    }


    button,
    input,
    textarea {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }


    /* LOGIN */

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }


    .login-card {
      width: min(430px, 100%);
      padding: 35px;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(36, 31, 31, 0.12);
    }


    .login-card h1 {
      margin: 0 0 8px;
      font-family: "Fraunces", serif;
      font-size: 34px;
    }


    .login-card p {
      margin: 0 0 25px;
      color: var(--muted);
    }


    /* HEADER */

    header {
      padding: 25px 0;
      border-bottom: 1px solid var(--border);
      background: var(--cream);
    }


    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }


    .brand h1 {
      margin: 0;
      font-family: "Fraunces", serif;
      font-size: 30px;
    }


    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }


    /* DASHBOARD */

    .dashboard {
      padding: 40px 0 70px;
    }


    .dashboard-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }


    .dashboard-top h2 {
      margin: 0;
      font-family: "Fraunces", serif;
      font-size: 32px;
    }


    .form-card,
    .salons-card {
      padding: 28px;
      margin-bottom: 25px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(36, 31, 31, 0.05);
    }


    .form-card h3,
    .salons-card h3 {
      margin: 0 0 20px;
      font-family: "Fraunces", serif;
      font-size: 24px;
    }


    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }


    .full {
      grid-column: 1 / -1;
    }


    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
    }


    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }


    input:focus,
    textarea:focus {
      border-color: var(--berry);
      box-shadow: 0 0 0 3px rgba(161, 61, 99, 0.08);
    }


    textarea {
      min-height: 100px;
      resize: vertical;
    }


    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }


    .checkbox input {
      width: auto;
    }


    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }


    .btn {
      min-height: 44px;
      padding: 11px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--berry);
      color: white;
      font-weight: 800;
    }


    .btn:hover {
      background: var(--berry-dark);
    }


    .btn-secondary {
      background: #eee5e1;
      color: var(--ink);
    }


    .btn-secondary:hover {
      background: #e3d8d4;
    }


    .btn-danger {
      background: var(--danger);
    }


    .btn-danger:hover {
      background: #8d2828;
    }


    .btn-gold {
      background: var(--gold);
      color: var(--ink);
    }


    .btn-gold:hover {
      background: #b7893c;
    }


    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }


    .message.show {
      display: block;
    }


    .message.error {
      background: #f8e4e4;
      color: var(--danger);
    }


    .message.success {
      background: #e3f2e9;
      color: var(--success);
    }


    /* SALON TABLE */

    .table-wrapper {
      overflow-x: auto;
    }


    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }


    th,
    td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }


    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }


    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e3f2e9;
      color: var(--success);
      font-size: 11px;
      font-weight: 800;
    }


    .status.hidden {
      background: #eee5e1;
      color: var(--muted);
    }


    .table-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }


    .small-btn {
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      background: #eee5e1;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }


    .small-btn.delete {
      background: #f8e4e4;
      color: var(--danger);
    }


    .empty {
      padding: 25px;
      color: var(--muted);
      text-align: center;
    }


    /* HIDDEN */

    .hidden {
      display: none !important;
    }


    /* MOBILE */

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .header-inner,
      .dashboard-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .form-card,
      .salons-card {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- LOGIN -->

  <section
    id="login-screen"
    class="login-screen"
  >

    <div class="login-card">

      <h1>EBB Studio</h1>

      <p>
        Admin dashboard
      </p>

      <div
        id="login-message"
        class="message"
      ></div>

      <form id="login-form">

        <div style="margin-bottom: 15px;">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="admin@example.com"
            required
          >

        </div>


        <div>

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Your password"
            required
          >

        </div>


        <button
          type="submit"
          class="btn"
          style="width:100%; margin-top:20px;"
        >
          Log In
        </button>

      </form>

    </div>

  </section>


  <!-- ADMIN APP -->

  <div
    id="admin-app"
    class="hidden"
  >

    <header>

      <div class="page header-inner">

        <div class="brand">

          <h1>EBB Studio</h1>

          <p>
            Salon management
          </p>

        </div>


        <button
          id="logout-btn"
          class="btn btn-secondary"
        >
          Log Out
        </button>

      </div>

    </header>


    <main class="page dashboard">


      <div class="dashboard-top">

        <div>

          <h2>Salons</h2>

          <p style="color:var(--muted); margin:5px 0 0;">
            Add and manage salons displayed on EBB Studio.
          </p>

        </div>

      </div>


      <!-- FORM -->

      <section class="form-card">

        <h3 id="form-title">
          Add a salon
        </h3>


        <div
          id="form-message"
          class="message"
        ></div>


        <form id="salon-form">

          <input
            type="hidden"
            id="salon-id"
          >


          <div class="form-grid">


            <div>

              <label for="name">
                Salon name
              </label>

              <input
                id="name"
                type="text"
                placeholder="Example: Bella Nails"
                required
              >

            </div>


            <div>

              <label for="location">
                Location
              </label>

              <input
                id="location"
                type="text"
                placeholder="Example: Gaborone"
                required
              >

            </div>


            <div class="full">

              <label for="services">
                Services
              </label>

              <textarea
                id="services"
                placeholder="Example: Gel nails, acrylics, manicures"
                required
              ></textarea>

            </div>


            <div>

              <label for="price">
                Starting price (P)
              </label>

              <input
                id="price"
                type="number"
                min="0"
                step="1"
                placeholder="150"
                required
              >

            </div>


            <div>

              <label for="whatsapp">
                WhatsApp number
              </label>

              <input
                id="whatsapp"
                type="text"
                value="26777426421"
                placeholder="267XXXXXXXX"
                required
              >

            </div>


            <div>

              <label for="sort-order">
                Sort order
              </label>

              <input
                id="sort-order"
                type="number"
                min="0"
                step="1"
                value="0"
              >

            </div>


            <div>

              <label class="checkbox">

                <input
                  id="featured"
                  type="checkbox"
                  checked
                >

                Show this salon publicly

              </label>

            </div>


          </div>


          <div class="actions">

            <button
              type="submit"
              class="btn"
              id="save-btn"
            >
              Add Salon
            </button>


            <button
              type="button"
              class="btn btn-secondary hidden"
              id="cancel-edit-btn"
            >
              Cancel Edit
            </button>

          </div>

        </form>

      </section>


      <!-- SALONS -->

      <section class="salons-card">

        <h3>
          Current salons
        </h3>


        <div
          id="list-message"
          class="message"
        ></div>


        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>
                  Salon
                </th>

                <th>
                  Location
                </th>

                <th>
                  Price
                </th>

                <th>
                  WhatsApp
                </th>

                <th>
                  Status
                </th>

                <th>
                  Actions
                </th>

              </tr>

            </thead>


            <tbody id="salon-list">

              <tr>

                <td
                  colspan="6"
                  class="empty"
                >
                  Loading salons...

                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </section>

    </main>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /*
      IMPORTANT:
      Replace these with your actual Supabase values.

      Dashboard
      → Project Settings
      → API
    */

    const SUPABASE_URL =
      "https://idmngsuutylklyexypox.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkbW5nc3V1dHlsa2x5ZXh5cG94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MjU0OTYsImV4cCI6MjEwMTMwMTQ5Nn0.tpDKJmE3y-EHWOB-KCFfE1bO18S4jpoVj-Qt9YRZUBg ";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const loginScreen =
      document.getElementById("login-screen");

    const adminApp =
      document.getElementById("admin-app");

    const loginForm =
      document.getElementById("login-form");

    const salonForm =
      document.getElementById("salon-form");

    const salonList =
      document.getElementById("salon-list");


    function showMessage(
      element,
      message,
      type = "error"
    ) {

      element.textContent = message;

      element.className =
        `message show ${type}`;

    }


    function hideMessage(element) {

      element.textContent = "";

      element.className =
        "message";

    }


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      const div =
        document.createElement("div");

      div.textContent =
        String(value);

      return div.innerHTML;

    }


    function showAdmin() {

      loginScreen.classList.add("hidden");

      adminApp.classList.remove("hidden");

      loadSalons();

    }


    function showLogin() {

      adminApp.classList.add("hidden");

      loginScreen.classList.remove("hidden");

    }


    async function checkSession() {

      const {
        data: {
          session
        }
      } = await supabaseClient
        .auth
        .getSession();


      if (session) {

        showAdmin();

      } else {

        showLogin();

      }

    }


    /* LOGIN */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;


        const loginMessage =
          document.getElementById(
            "login-message"
          );


        hideMessage(loginMessage);


        const {
          error
        } = await supabaseClient
          .auth
          .signInWithPassword({
            email,
            password
          });


        if (error) {

          console.error(error);

          showMessage(
            loginMessage,
            error.message,
            "error"
          );

          return;

        }


        loginForm.reset();

        showAdmin();

      }
    );


    /* LOGOUT */

    document
      .getElementById("logout-btn")
      .addEventListener(
        "click",
        async function() {

          await supabaseClient
            .auth
            .signOut();

          showLogin();

        }
      );


    /* LOAD SALONS */

    async function loadSalons() {

      salonList.innerHTML = `
        <tr>
          <td colspan="6" class="empty">
            Loading salons...
          </td>
        </tr>
      `;


      const {
        data,
        error
      } = await supabaseClient

        .from("salons")

        .select("*")

        .order("sort_order", {
          ascending: true
        })

        .order("created_at", {
          ascending: false
        });


      if (error) {

        console.error(error);

        salonList.innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              Could not load salons.
            </td>
          </tr>
        `;

        return;

      }


      if (!data || data.length === 0) {

        salonList.innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              No salons added yet.
            </td>
          </tr>
        `;

        return;

      }


      salonList.innerHTML =
        data.map(salon => `

          <tr>

            <td>

              <strong>
                ${escapeHtml(salon.name)}
              </strong>

              <br>

              <small style="color:#777;">
                ${escapeHtml(salon.services)}
              </small>

            </td>


            <td>
              ${escapeHtml(salon.location)}
            </td>


            <td>
              P${Number(salon.price_from).toLocaleString()}
            </td>


            <td>
              ${escapeHtml(salon.whatsapp)}
            </td>


            <td>

              ${
                salon.featured

                  ? `<span class="status">
                       Public
                     </span>`

                  : `<span class="status hidden">
                       Hidden
                     </span>`
              }

            </td>


            <td>

              <div class="table-actions">

                <button
                  class="small-btn"
                  onclick="editSalon('${salon.id}')"
                >
                  Edit
                </button>

                <button
                  class="small-btn delete"
                  onclick="deleteSalon('${salon.id}')"
                >
                  Delete
                </button>

              </div>

            </td>

          </tr>

        `).join("");

    }


    /* ADD / EDIT */

    salonForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const id =
          document.getElementById(
            "salon-id"
          ).value;


        const salonData = {

          name:
            document.getElementById("name")
              .value
              .trim(),

          location:
            document.getElementById("location")
              .value
              .trim(),

          services:
            document.getElementById("services")
              .value
              .trim(),

          price_from:
            Number(
              document.getElementById("price")
                .value
            ),

          whatsapp:
            document.getElementById("whatsapp")
              .value
              .trim(),

          featured:
            document.getElementById("featured")
              .checked,

          sort_order:
            Number(
              document.getElementById("sort-order")
                .value
            ) || 0

        };


        const formMessage =
          document.getElementById(
            "form-message"
          );


        hideMessage(formMessage);


        let error;


        if (id) {

          const result =
            await supabaseClient

              .from("salons")

              .update(salonData)

              .eq("id", id);

          error = result.error;

        } else {

          const result =
            await supabaseClient

              .from("salons")

              .insert(salonData);

          error = result.error;

        }


        if (error) {

          console.error(error);

          showMessage(
            formMessage,
            error.message,
            "error"
          );

          return;

        }


        showMessage(
          formMessage,
          id
            ? "Salon updated successfully."
            : "Salon added successfully.",
          "success"
        );


        resetForm();

        loadSalons();

      }
    );


    /* EDIT */

    async function editSalon(id) {

      const {
        data,
        error
      } = await supabaseClient

        .from("salons")

        .select("*")

        .eq("id", id)

        .single();


      if (error) {

        console.error(error);

        alert(
          "Could not load salon."
        );

        return;

      }


      document.getElementById(
        "salon-id"
      ).value = data.id;


      document.getElementById(
        "name"
      ).value = data.name;


      document.getElementById(
        "location"
      ).value = data.location;


      document.getElementById(
        "services"
      ).value = data.services;


      document.getElementById(
        "price"
      ).value = data.price_from;


      document.getElementById(
        "whatsapp"
      ).value = data.whatsapp;


      document.getElementById(
        "featured"
      ).checked = data.featured;


      document.getElementById(
        "sort-order"
      ).value = data.sort_order;


      document.getElementById(
        "form-title"
      ).textContent =
        "Edit salon";


      document.getElementById(
        "save-btn"
      ).textContent =
        "Save Changes";


      document.getElementById(
        "cancel-edit-btn"
      ).classList.remove(
        "hidden"
      );


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* DELETE */

    async function deleteSalon(id) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this salon?"
        );


      if (!confirmed) {
        return;
      }


      const {
        error
      } = await supabaseClient

        .from("salons")

        .delete()

        .eq("id", id);


      if (error) {

        console.error(error);

        alert(
          "Could not delete salon: " +
          error.message
        );

        return;

      }


      loadSalons();

    }


    /* RESET FORM */

    function resetForm() {

      salonForm.reset();


      document.getElementById(
        "salon-id"
      ).value = "";


      document.getElementById(
        "whatsapp"
      ).value =
        "26777426421";


      document.getElementById(
        "sort-order"
      ).value =
        "0";


      document.getElementById(
        "featured"
      ).checked =
        true;


      document.getElementById(
        "form-title"
      ).textContent =
        "Add a salon";


      document.getElementById(
        "save-btn"
      ).textContent =
        "Add Salon";


      document.getElementById(
        "cancel-edit-btn"
      ).classList.add(
        "hidden"
      );

    }


    document
      .getElementById(
        "cancel-edit-btn"
      )
      .addEventListener(
        "click",
        function() {

          resetForm();

          hideMessage(
            document.getElementById(
              "form-message"
            )
          );

        }
      );


    /*
      Watch authentication changes.
    */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(event, session) {

          if (session) {

            showAdmin();

          } else {

            showLogin();

          }

        }
      );


    /*
      Start app.
    */

    checkSession();

  </script>

</body>
</html>
